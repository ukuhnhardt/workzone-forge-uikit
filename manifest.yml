modules:
  bitbucket:repoPullRequestOverviewPanel:
    - key: workzone-pull-request-overview-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: workzone-forge-uikit
  trigger:
    - key: pr-trigger
      events:
        - avi:bitbucket:created:pullrequest # Triggered when a pull request is created
        - avi:bitbucket:updated:pullrequest # Triggered when a pull request is updated
      function: pr-trigger-handler # Links to the webhook function
  function:
    - key: resolver
      handler: index.handler
    - key: pr-trigger-handler
      handler: index.pullRequestTriggerHandler
remotes:
  - key: wz-ace-app
    baseUrl: https://ai-insights-gc.au.ngrok.io
    operations:
      - compute
    auth:
      appSystemToken:
        enabled: true
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    read:repository:bitbucket:
      allowImpersonation: true
    write:repository:bitbucket:
      allowImpersonation: true
    admin:repository:bitbucket: {}
    delete:repository:bitbucket: {}
    read:pullrequest:bitbucket:
      allowImpersonation: true
    write:pullrequest:bitbucket:
      allowImpersonation: true
    read:project:bitbucket: {}
    admin:project:bitbucket: {}
    read:workspace:bitbucket: {}
    read:user:bitbucket: {}
    read:app-system-token: {}
    read:permission:bitbucket: {}
  external:
    fetch:
      backend:
        - https://api.bitbucket.org
        - https://bitbucket.org
app:
  runtime:
    name: nodejs20.x
  id: ari:cloud:ecosystem::app/d5d89972-711a-4111-bfc5-a3ee5d817c0a
